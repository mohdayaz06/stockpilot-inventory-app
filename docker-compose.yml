version: "3.9"

services:

  mongodb:
    image: mongo:7
    container_name: mongodb
    restart: always

    ports:
      - "27017:27017"

    volumes:
      - mongodb_data:/data/db

    networks:
      - stockpilot-network


  backend:
    build: ./backend

    image: stockpilot-backend:v1

    container_name: backend

    restart: always

    depends_on:
      - mongodb

    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/stockpilot
      JWT_SECRET: stockpilot-secret

    ports:
      - "5000:5000"

    networks:
      - stockpilot-network


  frontend:
    build: ./frontend

    image: stockpilot-frontend:v1

    container_name: frontend

    restart: always

    depends_on:
      - backend

    ports:
      - "8080:8080"

    networks:
      - stockpilot-network


networks:
  stockpilot-network:


volumes:
  mongodb_data:
