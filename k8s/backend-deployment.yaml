apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend
  labels:
    app: backend

spec:
  replicas: 1

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
      - name: backend
        image: mohdayaz/stockpilot-backend:v1
        imagePullPolicy: Always

        ports:
        - containerPort: 5000

        env:
        - name: NODE_ENV
          value: production

        - name: PORT
          value: "5000"

        - name: MONGO_URI
          value: mongodb://mongodb:27017/stockpilot

        - name: JWT_SECRET
          value: stockpilot@123

        - name: JWT_EXPIRES_IN
          value: 1d

        - name: CORS_ORIGIN
          value: "*"
